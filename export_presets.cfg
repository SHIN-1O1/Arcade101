; Android export presets for Arcade 101. Contains NO secrets: the keystore path, alias and
; passwords stay empty here. Godot keeps what you type in the export dialog in
; .godot/export_credentials.cfg (not committed), or read them from the environment variables
; GODOT_ANDROID_KEYSTORE_RELEASE_PATH / _USER / _PASSWORD. Full walkthrough: docs/RELEASE.md.
; Godot rewrites this file when you open the Export dialog; that is fine, review the diff.

[preset.0]

name="Android Release (AAB)"
platform="Android"
runnable=false
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="docs/*, tools/*, tests/*, *.md"
export_path="build/arcade101.aab"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release=""
keystore/release_user=""
keystore/release_password=""
custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=true
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=true
gradle_build/export_format=1
gradle_build/min_sdk="24"
gradle_build/target_sdk=""
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0"
package/unique_name="com.shin1o1.arcade101"
package/name="Arcade 101"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
launcher_icons/main_192x192="res://branding/icon_legacy_192.png"
launcher_icons/adaptive_foreground_432x432="res://branding/icon_foreground_432.png"
launcher_icons/adaptive_background_432x432="res://branding/icon_background_432.png"
launcher_icons/adaptive_monochrome_432x432="res://branding/icon_monochrome_432.png"
graphics/opengl_debug=false
xr_features/xr_mode=0
gesture/swipe_to_dismiss=true
screen/immersive_mode=false
screen/edge_to_edge=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=true
command_line/extra_args=""
apk_expansion/enable=false
permissions/internet=true
permissions/access_network_state=true
permissions/vibrate=true

